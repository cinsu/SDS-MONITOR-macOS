# Runs the automated tests for every push and pull request.
name: Tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the tests (on the Qt stand-in; the real-Qt tests are skipped here)
        run: python -m unittest discover -s tests -t tests -v
